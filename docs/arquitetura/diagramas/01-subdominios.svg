<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="640" fill="#fbf8f7"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1d1b1b">HemoFlow — Subdomínios</text>
  <text x="40" y="76" font-size="15" fill="#6b6262">Domínio: distribuição de hemocomponentes da coleta ao hospital, com cadeia fria</text>

  <!-- legenda -->
  <g font-size="14" fill="#1d1b1b">
    <rect x="760" y="34" width="18" height="18" rx="4" fill="#b3121f"/><text x="784" y="48">Core</text>
    <rect x="850" y="34" width="18" height="18" rx="4" fill="#1a7a76"/><text x="874" y="48">Suporte</text>
    <rect x="960" y="34" width="18" height="18" rx="4" fill="#6b7280"/><text x="984" y="48">Genérico</text>
  </g>

  <!-- CORE -->
  <rect x="40" y="110" width="1120" height="170" rx="16" fill="#fdecea" stroke="#b3121f" stroke-width="2"/>
  <text x="62" y="140" font-size="16" font-weight="700" fill="#b3121f">CORE — diferencial do HemoFlow</text>
  <g>
    <rect x="62" y="156" width="520" height="106" rx="12" fill="#fff" stroke="#b3121f" stroke-width="2"/>
    <text x="82" y="188" font-size="20" font-weight="700" fill="#1d1b1b">Alocação de Hemocomponentes</text>
    <text x="82" y="214" font-size="15" fill="#4b4242">Compatibilidade ABO/Rh (matriz 8×8), priorização FEFO,</text>
    <text x="82" y="236" font-size="15" fill="#4b4242">reserva de bolsas e tratamento de estoque insuficiente.</text>
  </g>
  <g>
    <rect x="618" y="156" width="520" height="106" rx="12" fill="#fff" stroke="#b3121f" stroke-width="2"/>
    <text x="638" y="188" font-size="20" font-weight="700" fill="#1d1b1b">Logística com Cadeia Fria</text>
    <text x="638" y="214" font-size="15" fill="#4b4242">Rede de unidades (grafo), caminho mínimo (Dijkstra),</text>
    <text x="638" y="236" font-size="15" fill="#4b4242">limite por componente, guia de transporte e entrega.</text>
  </g>

  <!-- SUPORTE -->
  <rect x="40" y="300" width="1120" height="170" rx="16" fill="#e7f3f2" stroke="#1a7a76" stroke-width="2"/>
  <text x="62" y="330" font-size="16" font-weight="700" fill="#1a7a76">SUPORTE — necessário, específico do negócio, sem ser o diferencial</text>
  <g font-size="14" fill="#4b4242">
    <rect x="62" y="346" width="200" height="106" rx="12" fill="#fff" stroke="#1a7a76" stroke-width="2"/>
    <text x="78" y="376" font-size="17" font-weight="700" fill="#1d1b1b">Captação</text>
    <text x="78" y="400">doadores, agendamentos,</text><text x="78" y="420">campanhas, doações</text>

    <rect x="278" y="346" width="200" height="106" rx="12" fill="#fff" stroke="#1a7a76" stroke-width="2"/>
    <text x="294" y="376" font-size="17" font-weight="700" fill="#1d1b1b">Estoque</text>
    <text x="294" y="400">bolsas, lotes, validade,</text><text x="294" y="420">entrada/saída, descarte</text>

    <rect x="494" y="346" width="200" height="106" rx="12" fill="#fff" stroke="#1a7a76" stroke-width="2"/>
    <text x="510" y="376" font-size="17" font-weight="700" fill="#1d1b1b">Demanda Hospitalar</text>
    <text x="510" y="400">requisições, janela de</text><text x="510" y="420">entrega, acompanhamento</text>

    <rect x="710" y="346" width="200" height="106" rx="12" fill="#fff" stroke="#1a7a76" stroke-width="2"/>
    <text x="726" y="376" font-size="17" font-weight="700" fill="#1d1b1b">Telemetria</text>
    <text x="726" y="400">temperatura e GPS</text><text x="726" y="420">simulados, alertas</text>

    <rect x="926" y="346" width="212" height="106" rx="12" fill="#fff" stroke="#1a7a76" stroke-width="2"/>
    <text x="942" y="376" font-size="17" font-weight="700" fill="#1d1b1b">Indicadores</text>
    <text x="942" y="400">estatística de estoque e</text><text x="942" y="420">demanda, risco de falta</text>
  </g>

  <!-- GENÉRICO -->
  <rect x="40" y="490" width="1120" height="126" rx="16" fill="#f1f2f4" stroke="#6b7280" stroke-width="2"/>
  <text x="62" y="520" font-size="16" font-weight="700" fill="#4b5563">GENÉRICO — compra-se ou usa-se pronto</text>
  <g font-size="15" fill="#1d1b1b">
    <rect x="62" y="536" width="250" height="62" rx="12" fill="#fff" stroke="#6b7280" stroke-width="2"/>
    <text x="80" y="566" font-weight="700">Identidade e Acesso</text><text x="80" y="587" font-size="13" fill="#4b5563">login, perfis, tokens</text>
    <rect x="330" y="536" width="250" height="62" rx="12" fill="#fff" stroke="#6b7280" stroke-width="2"/>
    <text x="348" y="566" font-weight="700">Notificações</text><text x="348" y="587" font-size="13" fill="#4b5563">e-mail, push, SMS</text>
    <rect x="598" y="536" width="250" height="62" rx="12" fill="#fff" stroke="#6b7280" stroke-width="2"/>
    <text x="616" y="566" font-weight="700">Mapas e Geolocalização</text><text x="616" y="587" font-size="13" fill="#4b5563">distâncias, tempo de via</text>
    <rect x="866" y="536" width="272" height="62" rx="12" fill="#fff" stroke="#6b7280" stroke-width="2"/>
    <text x="884" y="566" font-weight="700">Observabilidade</text><text x="884" y="587" font-size="13" fill="#4b5563">logs, métricas, health</text>
  </g>
</svg>
