<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b3333"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#fbf8f7"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1d1b1b">Projeção com microsserviços (um serviço por bounded context)</text>
  <g font-size="13" fill="#1d1b1b">
    <line x1="40" y1="72" x2="80" y2="72" stroke="#3b3333" stroke-width="2" marker-end="url(#s)"/><text x="88" y="76">síncrono (HTTP/REST)</text>
    <line x1="250" y1="72" x2="290" y2="72" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="298" y="76">assíncrono (eventos)</text>
    <rect x="460" y="62" width="16" height="16" rx="3" fill="#fde68a" stroke="#d97706"/><text x="482" y="76">serverless (opcional)</text>
  </g>

  <!-- Clientes + gateway -->
  <g font-size="15" text-anchor="middle" fill="#1d1b1b">
    <rect x="40" y="100" width="200" height="46" rx="23" fill="#fff" stroke="#9a8f8d"/><text x="140" y="129">Web (painéis)</text>
    <rect x="40" y="160" width="200" height="46" rx="23" fill="#fff" stroke="#9a8f8d"/><text x="140" y="189">Hospitais (REST)</text>
    <rect x="40" y="220" width="200" height="46" rx="23" fill="#fff" stroke="#9a8f8d"/><text x="140" y="249">App do motorista</text>
  </g>
  <rect x="290" y="100" width="170" height="166" rx="14" fill="#1d1b1b"/>
  <text x="375" y="168" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">API Gateway</text>
  <text x="375" y="192" font-size="12.5" fill="#d6cbc9" text-anchor="middle">roteamento · JWT</text>
  <text x="375" y="210" font-size="12.5" fill="#d6cbc9" text-anchor="middle">rate limit · CORS</text>
  <g stroke="#3b3333" stroke-width="2" marker-end="url(#s)"><path d="M242 123 L288 140"/><path d="M242 183 L288 183"/><path d="M242 243 L288 226"/></g>

  <!-- Serviços -->
  <g font-size="15" fill="#1d1b1b">
    <!-- linha 1 -->
    <rect x="520" y="96" width="200" height="84" rx="12" fill="#fff" stroke="#1a7a76" stroke-width="2.5"/>
    <text x="536" y="124" font-weight="700">svc-captacao</text><text x="536" y="146" font-size="12.5" fill="#6b6262">doadores, agenda,</text><text x="536" y="164" font-size="12.5" fill="#6b6262">campanhas</text>
    <rect x="740" y="96" width="200" height="84" rx="12" fill="#fff" stroke="#1a7a76" stroke-width="2.5"/>
    <text x="756" y="124" font-weight="700">svc-requisicoes</text><text x="756" y="146" font-size="12.5" fill="#6b6262">pedidos dos hospitais,</text><text x="756" y="164" font-size="12.5" fill="#6b6262">status para o hospital</text>
    <rect x="960" y="96" width="200" height="84" rx="12" fill="#f1f2f4" stroke="#6b7280" stroke-width="2.5"/>
    <text x="976" y="124" font-weight="700">svc-identidade</text><text x="976" y="146" font-size="12.5" fill="#6b6262">gerenciado (Keycloak /</text><text x="976" y="164" font-size="12.5" fill="#6b6262">Cognito) — emite JWT</text>
    <!-- linha 2 -->
    <rect x="520" y="200" width="200" height="84" rx="12" fill="#fff" stroke="#1a7a76" stroke-width="2.5"/>
    <text x="536" y="228" font-weight="700">svc-estoque</text><text x="536" y="250" font-size="12.5" fill="#6b6262">bolsas, validade,</text><text x="536" y="268" font-size="12.5" fill="#6b6262">reservas</text>
    <rect x="740" y="200" width="200" height="84" rx="12" fill="#fdecea" stroke="#b3121f" stroke-width="3"/>
    <text x="756" y="228" font-weight="700">svc-alocacao</text><text x="756" y="250" font-size="12.5" fill="#7d0c15">CORE · ABO/Rh + FEFO</text><text x="756" y="268" font-size="12.5" fill="#6b6262">2 réplicas</text>
    <rect x="960" y="200" width="200" height="84" rx="12" fill="#fdecea" stroke="#b3121f" stroke-width="3"/>
    <text x="976" y="228" font-weight="700">svc-logistica</text><text x="976" y="250" font-size="12.5" fill="#7d0c15">CORE · rede, Dijkstra,</text><text x="976" y="268" font-size="12.5" fill="#6b6262">entrega · 2 réplicas</text>
  </g>
  <path d="M462 150 L518 138" stroke="#3b3333" stroke-width="2" marker-end="url(#s)"/>
  <path d="M462 210 L518 236" stroke="#3b3333" stroke-width="2" marker-end="url(#s)"/>
  <text x="290" y="288" font-size="12" fill="#6b6262">gateway roteia para todos os serviços</text>
  <!-- reserva síncrona alocação -> estoque -->
  <path d="M738 242 L722 242" stroke="#3b3333" stroke-width="2" marker-end="url(#s)"/>

  <!-- Broker -->
  <rect x="520" y="330" width="640" height="70" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
  <text x="540" y="362" font-size="17" font-weight="700" fill="#92400e">Barramento de eventos</text>
  <text x="540" y="384" font-size="13" fill="#92400e">RabbitMQ / SNS+SQS</text>
  <text x="860" y="352" font-size="12" fill="#92400e">DoacaoRegistrada · RequisicaoAberta · AlocacaoConfirmada</text>
  <text x="860" y="370" font-size="12" fill="#92400e">EstoqueInsuficiente · GuiaEmitida</text>
  <text x="860" y="388" font-size="12" fill="#92400e">LeituraRegistrada · AlertaCadeiaFria</text>
  <g stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#e)">
    <path d="M620 286 L620 328"/><path d="M840 286 L840 328"/><path d="M1060 286 L1060 328"/>
  </g>

  <!-- linha 3 -->
  <g font-size="15" fill="#1d1b1b">
    <rect x="520" y="446" width="200" height="84" rx="12" fill="#fff" stroke="#1a7a76" stroke-width="2.5"/>
    <text x="536" y="474" font-weight="700">svc-indicadores</text><text x="536" y="496" font-size="12.5" fill="#6b6262">read model (CQRS),</text><text x="536" y="514" font-size="12.5" fill="#6b6262">painéis estatísticos</text>
    <rect x="740" y="446" width="200" height="84" rx="12" fill="#fff" stroke="#1a7a76" stroke-width="2.5"/>
    <text x="756" y="474" font-weight="700">svc-telemetria</text><text x="756" y="496" font-size="12.5" fill="#6b6262">ingestão de leituras,</text><text x="756" y="514" font-size="12.5" fill="#6b6262">alertas de cadeia fria</text>
    <rect x="960" y="446" width="200" height="84" rx="12" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>
    <text x="976" y="474" font-weight="700">fn-guia-transporte</text><text x="976" y="496" font-size="12.5" fill="#6b6262">função HTTP (Cloudflare</text><text x="976" y="514" font-size="12.5" fill="#6b6262">Workers) — já existe</text>
    <rect x="960" y="546" width="200" height="60" rx="12" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>
    <text x="976" y="572" font-weight="700">fn-notificacoes</text><text x="976" y="592" font-size="12.5" fill="#6b6262">e-mail/push por evento</text>
  </g>
  <g stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#e)">
    <path d="M620 402 L620 444"/><path d="M840 444 L840 402"/><path d="M1100 402 L1100 444"/>
  </g>
  <path d="M1060 286 C 1180 330, 1185 420, 1160 470" stroke="#3b3333" stroke-width="2" fill="none" marker-end="url(#s)"/>
  <text x="1110" y="300" font-size="11.5" fill="#6b6262">HTTP</text>
  <!-- sensores -->
  <rect x="740" y="560" width="200" height="46" rx="23" fill="#fff" stroke="#9a8f8d" stroke-dasharray="6 4"/>
  <text x="840" y="589" font-size="14" text-anchor="middle" fill="#1d1b1b">Sensores / simulador (MQTT)</text>
  <path d="M840 558 L840 532" stroke="#3b3333" stroke-width="2" marker-end="url(#s)"/>

  <!-- Bancos -->
  <text x="40" y="330" font-size="16" font-weight="700" fill="#1d1b1b">Banco por serviço</text>
  <g font-size="13" fill="#1d1b1b">
    <g><path d="M40 350 h200 v34 a100 12 0 0 1 -200 0z" fill="#e7f3f2" stroke="#1a7a76"/><ellipse cx="140" cy="350" rx="100" ry="12" fill="#cfe8e6" stroke="#1a7a76"/><text x="58" y="378">PostgreSQL · captação</text></g>
    <g><path d="M40 410 h200 v34 a100 12 0 0 1 -200 0z" fill="#e7f3f2" stroke="#1a7a76"/><ellipse cx="140" cy="410" rx="100" ry="12" fill="#cfe8e6" stroke="#1a7a76"/><text x="58" y="438">PostgreSQL · estoque</text></g>
    <g><path d="M40 470 h200 v34 a100 12 0 0 1 -200 0z" fill="#e7f3f2" stroke="#1a7a76"/><ellipse cx="140" cy="470" rx="100" ry="12" fill="#cfe8e6" stroke="#1a7a76"/><text x="58" y="498">PostgreSQL · requisições</text></g>
    <g><path d="M260 350 h200 v34 a100 12 0 0 1 -200 0z" fill="#fdecea" stroke="#b3121f"/><ellipse cx="360" cy="350" rx="100" ry="12" fill="#f6c9cd" stroke="#b3121f"/><text x="278" y="378">PostgreSQL · alocação</text></g>
    <g><path d="M260 410 h200 v34 a100 12 0 0 1 -200 0z" fill="#fdecea" stroke="#b3121f"/><ellipse cx="360" cy="410" rx="100" ry="12" fill="#f6c9cd" stroke="#b3121f"/><text x="278" y="438">PostgreSQL · logística</text></g>
    <g><path d="M260 470 h200 v34 a100 12 0 0 1 -200 0z" fill="#fff" stroke="#6b7280"/><ellipse cx="360" cy="470" rx="100" ry="12" fill="#e5e7eb" stroke="#6b7280"/><text x="278" y="498">Séries temporais · telemetria</text></g>
  </g>
  <text x="40" y="548" font-size="13" fill="#6b6262">Nenhum serviço lê o banco do outro:</text>
  <text x="40" y="566" font-size="13" fill="#6b6262">integração só por API ou evento.</text>

  <!-- Plataforma -->
  <rect x="40" y="640" width="1120" height="96" rx="14" fill="#1d1b1b"/>
  <text x="60" y="670" font-size="16" font-weight="700" fill="#fff">Plataforma transversal</text>
  <g font-size="13.5" fill="#e9dfdd">
    <text x="60" y="698">CI/CD: GitHub Actions → imagens no GHCR/ECR → deploy por serviço</text>
    <text x="60" y="720">Observabilidade: logs centralizados, métricas, tracing (OpenTelemetry), /actuator/health</text>
    <text x="640" y="698">Segurança: segredos em cofre, TLS, JWT validado no gateway</text>
    <text x="640" y="720">Resiliência: retry + DLQ no broker, outbox transacional, idempotência</text>
  </g>
</svg>
