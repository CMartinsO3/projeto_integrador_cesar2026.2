spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/hemoflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hemoflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hemoflow_local_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false