spring.application.name=hemoflow
server.port=8080
server.servlet.session.cookie.same-site=strict

spring.datasource.url=jdbc:h2:mem:hemoflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method

# Valores exclusivamente didáticos: não usar para armazenamento/transporte clínico.
hemoflow.demo.limite-rota-minutos=120
hemoflow.demo.intervalo-leitura-segundos=15
hemoflow.demo.timeout-conectividade-segundos=120
hemoflow.demo.verificacao-timeout-ms=10000
hemoflow.demo.faixas-temperatura.HEMACIAS.minimo-celsius=20
hemoflow.demo.faixas-temperatura.HEMACIAS.maximo-celsius=30
hemoflow.demo.faixas-temperatura.PLASMA.minimo-celsius=20
hemoflow.demo.faixas-temperatura.PLASMA.maximo-celsius=30
hemoflow.demo.faixas-temperatura.PLAQUETAS.minimo-celsius=20
hemoflow.demo.faixas-temperatura.PLAQUETAS.maximo-celsius=30
hemoflow.demo.faixas-temperatura.CRIOPRECIPITADO.minimo-celsius=20
hemoflow.demo.faixas-temperatura.CRIOPRECIPITADO.maximo-celsius=30
spring.thymeleaf.check-template-location=false

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:hemoflowdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
