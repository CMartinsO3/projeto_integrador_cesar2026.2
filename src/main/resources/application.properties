spring.application.name=hemoflow
server.port=8080

# ===== Actuator + Prometheus =====
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=hemoflow
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.info.env.enabled=true
info.app.name=HemoFlow
info.app.version=1.0.0
info.app.description=Sistema de Gestao de Hemoderivados

# ===== Tracing (Micrometer + OpenTelemetry -> Tempo) =====
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://tempo:4317

# ===== Logging =====
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

spring.datasource.url=jdbc:h2:mem:hemoflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
spring.thymeleaf.check-template-location=false

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:hemoflowdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
