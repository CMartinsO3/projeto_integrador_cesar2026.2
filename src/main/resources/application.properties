spring.application.name=hemoflow
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:hemoflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

hemoflow.admin.password=${HEMOFLOW_ADMIN_PASSWORD:admin}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=HemoFlow - Gestao e Distribuicao de Hemocomponentes
info.app.version=${APP_VERSION:0.0.1-SNAPSHOT}
info.app.git-sha=${GIT_SHA:local-dev}