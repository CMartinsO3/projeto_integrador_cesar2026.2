<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Gestão de bolsas — HemoFlow','operacional')}"></head>
<body class="operational-layout">
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('bolsas')}"></aside>
  <main id="conteudo" class="main">
    <header class="main-bar"><div><h1>Gestão de bolsas</h1><p>Entrada, FEFO e baixas operacionais.</p></div></header>
    <div class="main-body">
      <section class="card">
        <h2>Registrar entrada</h2>
        <form id="formEntrada" class="grid grid-3" data-testid="bolsas-entrada-form">
          <div class="field"><label for="tipoSanguineo">Tipo sanguíneo</label><select id="tipoSanguineo" data-testid="bolsas-entrada-tipo"><option value="O_NEG">O−</option><option value="O_POS">O+</option><option value="A_POS">A+</option><option value="A_NEG">A−</option><option value="B_POS">B+</option><option value="B_NEG">B−</option><option value="AB_POS">AB+</option><option value="AB_NEG">AB−</option></select></div>
          <div class="field"><label for="hemo">Hemocomponente</label><select id="hemo" data-testid="bolsas-entrada-componente"><option value="HEMACIAS">Hemácias</option><option value="PLAQUETAS">Plaquetas</option><option value="PLASMA">Plasma</option><option value="CRIOPRECIPITADO">Crioprecipitado</option></select></div>
          <div class="field"><label for="lote">Lote</label><input id="lote" required data-testid="bolsas-entrada-lote"></div>
          <div class="field"><label for="coleta">Data de coleta</label><input id="coleta" type="date" required data-testid="bolsas-entrada-coleta"></div>
          <div class="field"><label for="validade">Data de validade</label><input id="validade" type="date" required data-testid="bolsas-entrada-validade"></div>
          <div class="field"><label for="noRedeId">Localização</label><select id="noRedeId" data-testid="bolsas-entrada-local"><option value="">Carregando locais…</option></select></div>
          <button class="btn btn-teal" type="submit" data-testid="bolsas-entrada-submit">Registrar entrada</button>
        </form>
      </section>
      <section class="card" style="margin-top:1rem">
        <div class="section-head"><div><p class="kicker">Estoque ordenado por validade</p><h2>Bolsas em estoque</h2></div><button class="btn btn-ghost" type="button" data-bolsa-reload data-testid="bolsas-atualizar">Atualizar lista</button></div>
        <div class="row-2">
          <div class="field"><label for="bolsaStatusFiltro">Status</label><select id="bolsaStatusFiltro" data-testid="bolsas-filtro-status"><option value="">Todos</option><option value="DISPONIVEL">Disponível</option><option value="ALOCADA">Alocada</option><option value="EM_TRANSITO">Em trânsito</option><option value="ENTREGUE">Entregue</option><option value="DESCARTADA">Descartada</option></select></div>
          <div class="field"><label for="bolsaTipoFiltro">Tipo sanguíneo</label><select id="bolsaTipoFiltro" data-testid="bolsas-filtro-tipo-sanguineo"><option value="">Todos</option><option value="A_POS">A+</option><option value="A_NEG">A−</option><option value="B_POS">B+</option><option value="B_NEG">B−</option><option value="AB_POS">AB+</option><option value="AB_NEG">AB−</option><option value="O_POS">O+</option><option value="O_NEG">O−</option></select></div>
        </div>
        <div class="table-wrap" style="margin-top:1rem"><table class="data"><thead><tr><th>ID</th><th>Tipo</th><th>Hemocomp.</th><th>Lote</th><th>Validade</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabelaBolsas" data-testid="bolsas-tabela"></tbody></table></div>
      </section>
    </div>
  </main>
</div>
<dialog th:replace="~{fragments/feedback :: confirmDialog}"></dialog>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script type="module" th:src="@{/js/estoque.js}"></script>
</body>
</html>
