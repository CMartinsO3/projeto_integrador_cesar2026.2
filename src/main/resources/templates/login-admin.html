<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Equipe clínica — HemoFlow','operacional')}"></head>
<body class="operational-layout" data-auth-profile="ADMIN">
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<main id="conteudo" class="auth-shell">
  <aside class="auth-story">
    <a class="brand" th:href="@{/}" aria-label="HemoFlow — página inicial"><span class="mark" aria-hidden="true">H</span><span><strong>HemoFlow</strong><em>Área restrita</em></span></a>
    <p style="font-family:var(--font-serif);font-size:2.3rem">Vida em trânsito exige responsabilidade.</p>
  </aside>
  <section class="auth-form" aria-labelledby="adminTitulo">
    <form class="auth-card" data-auth-login data-testid="login-admin-form">
      <p class="kicker">Administração</p>
      <h1 id="adminTitulo">Sala de operações</h1>
      <div class="field"><label for="usuario">Usuário</label><input id="usuario" name="usuario" autocomplete="username" required data-testid="login-admin-usuario"></div>
      <div class="field" style="margin-top:1rem"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required data-testid="login-admin-senha"></div>
      <button class="btn btn-teal btn-full" type="submit" style="margin-top:1.25rem" data-testid="login-admin-submit">Abrir painel</button>
      <nav class="auth-links" aria-label="Acessos alternativos">
        <a th:href="@{/login-usuario}">Sou doador</a>
        <a th:href="@{/}">Voltar à central</a>
      </nav>
    </form>
  </section>
</main>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script type="module" th:src="@{/js/auth.js}"></script>
</body>
</html>
