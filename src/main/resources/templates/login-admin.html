<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Login Admin - HemoFlow</title>
<style>
body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#f0f0f0}
.box{background:white;padding:40px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.15);width:320px}
h1{margin:0 0 8px;font-size:1.4rem;color:#c0392b}
p{margin:0 0 24px;color:#666;font-size:.9rem}
label{display:block;margin-bottom:4px;font-size:.85rem;font-weight:600;color:#333}
input{width:100%;padding:9px;margin-bottom:16px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;font-size:.95rem}
button{width:100%;padding:10px;background:#c0392b;color:white;border:none;border-radius:4px;cursor:pointer;font-size:1rem}
button:hover{background:#a93226}
#erro{color:#c0392b;font-size:.85rem;margin-top:12px;display:none}
.links{margin-top:16px;text-align:center;font-size:.85rem}
.links a{color:#c0392b;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h1>🩸 HemoFlow</h1>
  <p>Área restrita — Administrador</p>
  <label>Usuário</label>
  <input id="usuario" placeholder="admin" autocomplete="username">
  <label>Senha</label>
  <input id="senha" type="password" placeholder="admin" autocomplete="current-password">
  <button onclick="login()">Entrar</button>
  <div id="erro">Usuário ou senha inválidos.</div>
  <div class="links"><a href="/login-usuario">Sou doador →</a></div>
</div>
<script>
async function login() {
  const res = await fetch('/api/v1/auth/login-admin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({usuario: document.getElementById('usuario').value, senha: document.getElementById('senha').value})
  });
  const d = await res.json();
  if (d.ok) window.location.href = d.redirect;
  else { document.getElementById('erro').style.display='block'; }
}
document.addEventListener('keydown', e => { if(e.key==='Enter') login(); });
</script>
</body></html>
