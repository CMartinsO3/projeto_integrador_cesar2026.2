<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Área do doador — HemoFlow','publica')}"></head>
<body class="public-layout" data-doador-dashboard>
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('doador')}"></aside>
  <main id="conteudo" class="main">
    <header class="main-bar"><div><h1>Seu espaço de doação</h1><p>Histórico e agenda da doação.</p></div></header>
    <div class="main-body">
      <section class="card">
        <p class="kicker" id="tipoSanguineo">Tipo sanguíneo: —</p>
        <h2 id="saudacao">Olá</h2>
      </section>
      <div class="grid grid-3" style="margin-top:1rem">
        <article class="kpi teal"><div class="label">Doações</div><div class="value" id="statDoacoes">—</div></article>
        <article class="kpi ok"><div class="label">Alcance estimado</div><div class="value" id="statVidas">—</div></article>
        <article class="kpi mute"><div class="label">Volume</div><div class="value" id="statVol">—</div></article>
      </div>
      <div class="grid grid-2" style="margin-top:1rem">
        <section class="card"><h2>Histórico de doações</h2><div class="table-wrap"><table class="data"><thead><tr><th>Data</th><th>Hospital</th><th>Volume (ml)</th></tr></thead><tbody id="tbHistorico"></tbody></table></div></section>
        <section class="card"><h2>Agendamentos</h2><div class="table-wrap"><table class="data"><thead><tr><th>Data/hora</th><th>Hospital</th><th>Status</th></tr></thead><tbody id="tbAgendamentos"></tbody></table></div><a class="btn btn-primary" style="margin-top:1rem" th:href="@{/mapa}" data-testid="doador-dashboard-mapa">Ver mapa e agendar</a></section>
      </div>
      <button class="btn btn-ghost" type="button" data-doador-logout data-testid="doador-dashboard-logout" style="margin-top:1rem">Encerrar sessão</button>
    </div>
  </main>
</div>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script type="module" th:src="@{/js/doador.js}"></script>
</body>
</html>
