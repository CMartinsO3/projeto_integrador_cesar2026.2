<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Cadastrar doador — HemoFlow','publica')}"></head>
<body class="public-layout">
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<header th:replace="~{fragments/navbar :: navbar('inicio','publica')}"></header>
<main id="conteudo" class="split-page">
  <aside class="auth-story" style="justify-content:center;gap:1.5rem">
    <p class="kicker" style="color:#bcdeda">Recife · hemorrede</p>
    <h1>Um cadastro breve. Um gesto que permanece.</h1>
  </aside>
  <section class="auth-form" aria-labelledby="cadastroDoadorTitulo">
    <form class="auth-card" data-doador-cadastro data-testid="doador-cadastro-form">
      <h1 id="cadastroDoadorTitulo">Ficha do doador</h1>
      <div class="form-stack">
        <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" required data-testid="doador-cadastro-nome"></div>
        <div class="row-2">
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required data-testid="doador-cadastro-email"></div>
          <div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="new-password" required data-testid="doador-cadastro-senha"></div>
        </div>
        <div class="row-2">
          <div class="field"><label for="nascimento">Data de nascimento</label><input id="nascimento" name="nascimento" type="date" required data-testid="doador-cadastro-nascimento"></div>
          <div class="field"><label for="tipo">Tipo sanguíneo</label><select id="tipo" name="tipo" data-testid="doador-cadastro-tipo"><option value="A_POS">A+</option><option value="A_NEG">A−</option><option value="B_POS">B+</option><option value="B_NEG">B−</option><option value="AB_POS">AB+</option><option value="AB_NEG">AB−</option><option value="O_POS">O+</option><option value="O_NEG">O−</option></select></div>
        </div>
      </div>
      <button class="btn btn-primary btn-full" type="submit" style="margin-top:1.25rem" data-testid="doador-cadastro-submit">Cadastrar e continuar</button>
    </form>
  </section>
</main>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script type="module" th:src="@{/js/doador.js}"></script>
</body>
</html>
