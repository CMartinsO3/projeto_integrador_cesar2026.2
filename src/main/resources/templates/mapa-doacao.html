<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onde doar — HemoFlow</title>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/pages.css}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="public-layout map-page">
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<header th:replace="~{fragments/navbar :: navbar('mapa','publica')}"></header>
<main id="conteudo" class="map-stage">
  <aside class="map-sheet" aria-labelledby="mapaTitulo">
    <p class="kicker">Recife</p>
    <h1 id="mapaTitulo" style="font-family:var(--font-serif)">Pontos de coleta</h1>
    <ul id="campanhas" aria-live="polite"><li>Carregando a programação…</li></ul>
  </aside>
  <div id="mapa" role="application" aria-label="Mapa dos pontos de doação"></div>
</main>
<dialog id="dialogAgendamento" class="confirm-dialog" aria-labelledby="hospitalAgendamento">
  <form id="formAgendamento" data-testid="mapa-agendamento-form">
    <p class="kicker">Agendamento de doação</p>
    <h2 id="hospitalAgendamento"></h2>
    <div class="field"><label for="dataAgendamento">Data (próximos 30 dias)</label><input id="dataAgendamento" type="date" required data-testid="mapa-agendamento-data"></div>
    <div class="field" style="margin-top:1rem"><label for="horarioAgendamento">Horário disponível</label><select id="horarioAgendamento" required disabled data-testid="mapa-agendamento-horario"><option value="">Selecione uma data primeiro</option></select></div>
    <div class="confirm-actions">
      <button id="fecharAgendamento" class="btn btn-ghost" type="button" data-testid="mapa-agendamento-fechar">Fechar</button>
      <button id="confirmarAgendamento" class="btn btn-primary" type="submit" disabled data-testid="mapa-agendamento-confirmar">Confirmar horário</button>
    </div>
  </form>
</dialog>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" th:src="@{/js/mapa.js}"></script>
</body>
</html>
