<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Acesso operacional — HemoFlow','operacional')}"></head>
<body class="operational-layout" data-auth-profile="">
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<main id="conteudo" class="auth-shell">
  <aside class="auth-story">
    <a class="brand" th:href="@{/}" aria-label="HemoFlow — página inicial"><span class="mark" aria-hidden="true">H</span><span><strong>HemoFlow</strong><em>Acesso restrito</em></span></a>
    <p style="font-family:var(--font-serif);font-size:2.3rem">Acesso operacional individual.</p>
  </aside>
  <section class="auth-form" aria-labelledby="operacionalTitulo">
    <form class="auth-card" data-auth-login data-testid="login-operacional-form">
      <p class="kicker" data-operational-profile>Perfil operacional</p>
      <h1 id="operacionalTitulo" data-operational-title>Entrar</h1>
      <div class="field"><label for="usuario">Usuário</label><input id="usuario" name="usuario" autocomplete="username" required data-testid="login-operacional-usuario"></div>
      <div class="field" style="margin-top:1rem"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required data-testid="login-operacional-senha"></div>
      <button class="btn btn-primary btn-full" type="submit" style="margin-top:1.25rem" data-testid="login-operacional-submit">Entrar</button>
      <nav class="auth-links" aria-label="Troca de perfil">
        <a th:href="@{/cadastro-operacional}">Criar meu cadastro</a>
        <a id="perfilAlternativo" href="/login-hospital">Acesso alternativo</a>
        <a th:href="@{/login-admin}">Administração</a>
        <a th:href="@{/}">Voltar à central</a>
      </nav>
    </form>
  </section>
</main>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script type="module" th:src="@{/js/auth.js}"></script>
</body>
</html>
