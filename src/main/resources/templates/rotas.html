<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotas da rede — HemoFlow</title>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/pages.css}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="map-page">
<header th:replace="~{fragments/navbar :: navbar('rotas','operacional')}"></header>
<main class="map-stage">
  <div id="mapa" role="application" aria-label="Mapa da topologia da hemorrede"></div>
  <section class="map-sheet" aria-labelledby="routeTitle">
    <p class="kicker">Malha de distribuição</p>
    <h1 id="routeTitle">Consultar rota</h1>
    <form id="routeForm" class="form-stack" data-testid="rotas-form">
      <div class="field"><label for="routeOrigin">Origem</label><select id="routeOrigin" required disabled data-testid="rotas-origem"><option value="">Carregando pontos da rede...</option></select></div>
      <div class="field"><label for="routeDestination">Destino</label><select id="routeDestination" required disabled data-testid="rotas-destino"><option value="">Carregando pontos da rede...</option></select></div>
      <button id="routeSubmit" class="btn btn-primary" type="submit" disabled data-testid="rotas-submit">Calcular rota</button>
    </form>
    <p class="notice notice-warn" style="margin-top:1rem">O cálculo usa o vizinho mais próximo. Rotas acima de 120 min recebem alerta didático de cadeia fria.</p>
    <p class="sr-only"><code>/api/v1/topologia</code> · <code>/api/v1/rotas/vizinho-mais-proximo</code></p>
    <section id="routeResult" hidden aria-live="polite" data-testid="rotas-resultado">
      <h2>Resultado</h2>
      <p id="routeColdWarning" class="notice notice-danger" hidden role="alert"></p>
      <p><strong>Tempo total:</strong> <span id="routeTime"></span></p>
      <p><strong>Distância total:</strong> <span id="routeDistance"></span></p>
      <h3>Sequência de pontos</h3><ol id="routeStops"></ol>
    </section>
  </section>
</main>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" th:src="@{/js/rotas.js}"></script>
</body>
</html>
