<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Contas operacionais — HemoFlow','operacional')}"></head>
<body class="operational-layout" data-admin-page="contas">
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('contas')}"></aside>
  <main id="conteudo" class="main">
    <header class="main-bar"><div><h1>Contas operacionais</h1><p>Cadastros, aprovações e atribuições.</p></div></header>
    <div class="main-body">
      <section class="card">
        <h2>Criar conta</h2>
        <form id="criarContaForm" class="grid grid-3" data-testid="contas-criar-form">
          <div class="field"><label for="contaNome">Nome completo</label><input id="contaNome" required data-testid="contas-criar-nome"></div>
          <div class="field"><label for="contaUsuario">Usuário</label><input id="contaUsuario" required data-testid="contas-criar-usuario"></div>
          <div class="field"><label for="contaSenha">Senha</label><input id="contaSenha" type="password" minlength="8" required data-testid="contas-criar-senha"></div>
          <div class="field"><label for="contaPerfil">Perfil</label><select id="contaPerfil" data-testid="contas-criar-perfil"><option value="HOSPITAL">Hospital</option><option value="MOTORISTA">Motorista</option></select></div>
          <div class="field"><label for="contaHospital">Hospital associado</label><select id="contaHospital" data-testid="contas-criar-hospital"></select></div>
          <button class="btn btn-teal" type="submit" data-testid="contas-criar-submit">Criar conta</button>
        </form>
      </section>
      <section class="card" style="margin-top:1rem"><h2>Solicitações hospitalares</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Nome</th><th>Usuário</th><th>Hospital</th><th>Ação</th></tr></thead><tbody id="solicitacoesHospital" data-testid="contas-pendentes-tabela"></tbody></table></div></section>
      <section class="card" style="margin-top:1rem">
        <h2>Atribuir entrega</h2>
        <form id="atribuirEntregaForm" class="row-2" data-testid="contas-atribuicao-form">
          <div class="field"><label for="entregaAtribuicao">Entrega</label><select id="entregaAtribuicao" data-testid="contas-atribuicao-entrega"></select></div>
          <div class="field"><label for="motoristaAtribuicao">Motorista</label><select id="motoristaAtribuicao" data-testid="contas-atribuicao-motorista"></select></div>
          <button class="btn btn-ghost" type="submit" data-testid="contas-atribuicao-submit">Atribuir entrega</button>
        </form>
      </section>
    </div>
  </main>
</div>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script type="module" th:src="@{/js/admin.js}"></script>
</body>
</html>
