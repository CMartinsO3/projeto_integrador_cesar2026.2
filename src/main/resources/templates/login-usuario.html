<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Entrada do doador — HemoFlow','publica')}"></head>
<body class="public-layout" data-auth-profile="DOADOR">
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<main id="conteudo" class="auth-shell">
  <aside class="auth-story">
    <a class="brand" th:href="@{/}" aria-label="HemoFlow — página inicial"><span class="mark" aria-hidden="true">H</span><span><strong>HemoFlow</strong><em>Portal do doador</em></span></a>
    <div><p style="font-family:var(--font-serif);font-size:2.3rem">Doar é um gesto tranquilo e extraordinário.</p></div>
    <small>Ambiente exclusivo do doador</small>
  </aside>
  <section class="auth-form" aria-labelledby="loginTitulo">
    <form class="auth-card" data-auth-login data-testid="login-doador-form">
      <p class="kicker">Acesso pessoal</p>
      <h1 id="loginTitulo">Bem-vindo de volta</h1>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required data-testid="login-doador-email"></div>
      <div class="field" style="margin-top:1rem"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required data-testid="login-doador-senha"></div>
      <button class="btn btn-primary btn-full" type="submit" style="margin-top:1.25rem" data-testid="login-doador-submit">Entrar</button>
      <nav class="auth-links" aria-label="Acessos alternativos">
        <a th:href="@{/doe-agora}" data-testid="login-doador-cadastro">Ainda não tenho cadastro</a>
        <a th:href="@{/login-admin}">Sou da equipe clínica</a>
        <a th:href="@{/}">Voltar à central</a>
      </nav>
    </form>
  </section>
</main>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script type="module" th:src="@{/js/auth.js}"></script>
</body>
</html>
