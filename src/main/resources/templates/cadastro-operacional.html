<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Criar cadastro operacional — HemoFlow','operacional')}"></head>
<body class="operational-layout" data-auth-profile="OPERACIONAL">
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<main id="conteudo" class="auth-shell">
  <aside class="auth-story">
    <a class="brand" th:href="@{/}" aria-label="HemoFlow — página inicial"><span class="mark" aria-hidden="true">H</span><span><strong>HemoFlow</strong><em>Cadastro operacional</em></span></a>
    <p style="font-family:var(--font-serif);font-size:2.3rem">Acesso operacional individual.</p>
  </aside>
  <section class="auth-form" aria-labelledby="cadastroTitulo">
    <form class="auth-card" data-auth-cadastro data-testid="cadastro-operacional-form">
      <p class="kicker">Novo acesso</p>
      <h1 id="cadastroTitulo">Criar cadastro</h1>
      <div class="form-stack">
        <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" autocomplete="name" maxlength="160" required data-testid="cadastro-operacional-nome"></div>
        <div class="field"><label for="usuario">Usuário</label><input id="usuario" name="usuario" autocomplete="username" maxlength="120" required data-testid="cadastro-operacional-usuario"></div>
        <div class="field"><label for="senha">Senha (mínimo de 8 caracteres)</label><input id="senha" name="senha" type="password" minlength="8" maxlength="72" autocomplete="new-password" required data-testid="cadastro-operacional-senha"></div>
        <div class="field"><label for="perfil">Perfil</label><select id="perfil" name="perfil" required data-testid="cadastro-operacional-perfil"><option value="MOTORISTA">Motorista</option><option value="HOSPITAL">Hospital</option></select></div>
        <div class="field" id="hospitalGroup" hidden><label for="hospitalId">Hospital</label><select id="hospitalId" name="hospitalId" data-testid="cadastro-operacional-hospital"><option value="">Carregando hospitais...</option></select></div>
      </div>
      <button class="btn btn-primary btn-full" type="submit" style="margin-top:1.25rem" data-testid="cadastro-operacional-submit">Criar cadastro</button>
      <nav class="auth-links" aria-label="Acesso existente">
        <a id="loginLink" th:href="@{/login-motorista}" data-testid="cadastro-operacional-login">Já tenho cadastro</a>
        <a th:href="@{/}">Voltar à central</a>
      </nav>
    </form>
  </section>
</main>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script type="module" th:src="@{/js/auth.js}"></script>
</body>
</html>
