<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Requisições hospitalares — HemoFlow','operacional')}"></head>
<body class="operational-layout">
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<header th:replace="~{fragments/navbar :: navbar('requisicoes','operacional')}"></header>
<main id="conteudo" class="wrap page-content">
  <section class="section-head"><div><p class="kicker">Atendimento hospitalar</p><h1>Requisições hospitalares</h1></div><p>Crie pedidos e acompanhe o status informado pelo hemocentro.</p></section>
  <p class="notice notice-warn" data-testid="requisicoes-alerta-acesso">Acesso restrito à conta hospitalar autenticada.</p>
  <div class="grid grid-2">
    <section class="card">
      <h2>Criar requisição</h2>
      <form id="requestForm" class="form-stack" data-testid="requisicoes-form">
        <div class="field"><label for="hospitalId">Hospital solicitante</label><select id="hospitalId" required data-testid="requisicoes-hospital"><option value="">Carregando hospitais...</option></select></div>
        <div class="row-2">
          <div class="field"><label for="bloodType">Tipo sanguíneo</label><select id="bloodType" required data-testid="requisicoes-tipo-sanguineo"></select></div>
          <div class="field"><label for="component">Hemocomponente</label><select id="component" required data-testid="requisicoes-componente"></select></div>
        </div>
        <div class="row-2">
          <div class="field"><label for="quantity">Quantidade de bolsas</label><input id="quantity" type="number" min="1" value="1" required data-testid="requisicoes-quantidade"></div>
          <div class="field"><label for="deliveryWindow">Janela de entrega</label><input id="deliveryWindow" type="datetime-local" required data-testid="requisicoes-janela"></div>
        </div>
        <button id="submitRequest" class="btn btn-primary" type="submit" data-testid="requisicoes-submit">Enviar requisição</button>
      </form>
    </section>
    <section class="card">
      <h2>Consultar requisições</h2>
      <div class="field"><label for="hospitalFilter">Filtrar por hospital</label><select id="hospitalFilter" data-testid="requisicoes-filtro-hospital"><option value="">Selecione um hospital</option></select></div>
      <div class="table-wrap" style="margin-top:1rem"><table class="data-table"><thead><tr><th>Pedido</th><th>Componente</th><th>Qtd.</th><th>Janela</th><th>Status</th></tr></thead><tbody id="requestRows" data-testid="requisicoes-tabela"></tbody></table></div>
    </section>
  </div>
</main>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script type="module" th:src="@{/js/requisicoes.js}"></script>
</body>
</html>
