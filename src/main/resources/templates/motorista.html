<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Acompanhamento do motorista — HemoFlow','operacional')}"></head>
<body class="operational-layout">
<a class="skip-link" href="#conteudo">Ir ao conteúdo</a>
<header th:replace="~{fragments/navbar :: navbar('motorista','operacional')}"></header>
<main id="conteudo" class="wrap page-content">
  <section class="section-head"><div><p class="kicker">Logística</p><h1>Acompanhamento da entrega</h1></div><p>Rotas e atualização de status atribuídos à conta.</p></section>
  <p class="notice notice-warn" data-testid="motorista-aviso-acesso">Acesso restrito às entregas atribuídas à sua conta.</p>
  <p id="deliveryStatus" class="notice" role="status" aria-live="polite" data-testid="motorista-status">Carregando entregas...</p>
  <section id="deliveries" class="grid grid-2" data-testid="motorista-entregas"></section>
  <button id="logoutLink" class="btn btn-ghost" type="button" data-testid="motorista-logout" style="margin-top:1rem">Sair</button>
</main>
<div th:replace="~{fragments/feedback :: feedback}"></div>
<script type="module" th:src="@{/js/motorista.js}"></script>
</body>
</html>
