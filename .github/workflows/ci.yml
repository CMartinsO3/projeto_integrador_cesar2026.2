name: CI - Validacao, Build de Imagem e Smoke Test

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Temurin) e Cache Maven
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Executar suite completa de testes (Unitarios, Integracao e BDD)
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Publicar relatorios do Surefire em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: target/surefire-reports/
          retention-days: 7

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Construir imagem multi-stage (valida Dockerfile e testes no 1o estagio)
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg APP_VERSION=0.0.1-SNAPSHOT \
            -t hemoflow:${{ github.sha }} .

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-24.04
    needs: docker-build
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Validar compose.yaml e subir stack (API + PostgreSQL real)
        run: |
          docker compose config -q
          GIT_SHA=${{ github.sha }} docker compose up -d --build

      - name: Aguardar servicos ficarem healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' hemoflow-api 2>/dev/null || echo "starting")
            echo "Tentativa $i/30 - Status da API: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            sleep 5
          done
          docker compose ps
          test "$(docker inspect --format='{{.State.Health.Status}}' hemoflow-api)" = "healthy"

      - name: Smoke test HTTP contra API e PostgreSQL real
        run: |
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://localhost:8080/actuator/info | grep -q "${{ github.sha }}"
          curl -fsS http://localhost:8080/api/v1/topologia

      - name: Coletar logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar stack e limpar volumes
        if: always()
        run: docker compose down -v